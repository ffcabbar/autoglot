<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1f"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <g font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#e2e8f0" text-anchor="middle">
    <!-- Box 1 -->
    <g transform="translate(40 110)">
      <rect width="180" height="100" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
      <text x="90" y="44">edit</text>
      <text x="90" y="68" font-family="ui-monospace, monospace" fill="#a78bfa">en.json</text>
    </g>

    <!-- Arrow -->
    <line x1="225" y1="160" x2="265" y2="160" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 2 -->
    <g transform="translate(270 110)">
      <rect width="180" height="100" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
      <text x="90" y="44">diff vs</text>
      <text x="90" y="68" font-family="ui-monospace, monospace" fill="#a78bfa">translate.lock</text>
    </g>

    <!-- Arrow -->
    <line x1="455" y1="160" x2="495" y2="160" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 3 -->
    <g transform="translate(500 110)">
      <rect width="220" height="100" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="44">Anthropic API</text>
      <text x="110" y="68" font-size="12" fill="#a78bfa">only changed keys</text>
    </g>

    <!-- Arrow -->
    <line x1="725" y1="160" x2="765" y2="160" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 4 -->
    <g transform="translate(770 110)">
      <rect width="220" height="100" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
      <text x="110" y="44">merge into</text>
      <text x="110" y="68" font-family="ui-monospace, monospace" fill="#a78bfa">&lt;locale&gt;.json</text>
    </g>

    <!-- Arrow -->
    <line x1="995" y1="160" x2="1035" y2="160" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 5 -->
    <g transform="translate(1040 110)">
      <rect width="200" height="100" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
      <text x="100" y="44">bot commit</text>
      <text x="100" y="68" font-size="12" fill="#a78bfa">+ PR comment</text>
    </g>

    <!-- Header -->
    <text x="640" y="40" font-size="16" fill="#94a3b8" font-weight="600" letter-spacing="2">HOW AUTOI18N WORKS</text>
    <text x="640" y="280" font-size="13" fill="#64748b">runs on every push · only changed keys hit the LLM · zero re-translation cost</text>
  </g>
</svg>
