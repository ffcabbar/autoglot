name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include the command you ran, the output you got, and the output you expected.
      placeholder: "I ran `npx autoglot` and..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: autoglot version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "v22.5.1"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - GitHub Action
        - CLI on local machine
        - CLI in another CI (GitLab/CircleCI/etc.)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: translate.config.json (redact secrets)
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redact secrets and full translations)
      render: shell
