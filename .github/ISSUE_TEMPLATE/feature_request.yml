name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "When I do X, autoi18n does Y, but I want it to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I would be willing to contribute a PR for this.
        - label: I would be willing to fund this via Polar.sh / GitHub Sponsors.
