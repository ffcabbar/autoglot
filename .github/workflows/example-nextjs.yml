name: Next.js example

on:
  pull_request:
    branches: [main]
    paths:
      - examples/nextjs/**
      - .github/workflows/example-nextjs.yml
  push:
    branches: [main]
    paths:
      - examples/nextjs/**
      - .github/workflows/example-nextjs.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/nextjs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run translate:check
      - run: npm run build
      - name: Verify prerendered English and Spanish pages
        run: |
          grep -Fq '<html lang="en">' .next/server/app/en.html
          grep -Fq '<h1>Make time for a walk.</h1>' .next/server/app/en.html
          grep -Fq '<html lang="es">' .next/server/app/es.html
          grep -Fq '<h1>Haz tiempo para dar un paseo.</h1>' .next/server/app/es.html
