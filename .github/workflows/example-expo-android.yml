name: Expo Android example

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/expo-android/**'
      - '.github/workflows/example-expo-android.yml'
  push:
    branches: [main]
    paths:
      - 'examples/expo-android/**'
      - '.github/workflows/example-expo-android.yml'

permissions:
  contents: read

jobs:
  android:
    name: Expo Android export
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: examples/expo-android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Check committed translations
        run: npm run translations:check
      - name: Export Android bundle
        run: npm run export:android
