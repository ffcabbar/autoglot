name: 'autoglot'
description: 'AI-powered i18n translation bot. Diff your en.json on every push, translate only what changed, commit the JSON files back. MIT alternative to Languine, Lokalise, and Crowdin.'
branding:
  icon: 'globe'
  color: 'purple'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key. Required.'
    required: true
  source:
    description: 'Path to your source locale file (e.g. messages/en.json).'
    required: false
  messages-dir:
    description: 'Directory containing your locale JSON files.'
    required: false
  lock-file:
    description: 'Path to the translation lock file.'
    required: false
  config:
    description: 'Path to translate.config.json.'
    required: false
  model:
    description: 'Anthropic model id.'
    required: false
  commit:
    description: 'If "true", commit and push translation changes back to the branch.'
    required: false
    default: 'true'
  pr-comment:
    description: 'If "true", post a cost-summary comment on the open PR (requires GITHUB_TOKEN).'
    required: false
    default: 'true'
  package-version:
    description: 'Use a specific npm version or dist-tag. Defaults to the CLI bundled with this Action ref.'
    required: false

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run translation
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        SUMMARY_PATH: ${{ runner.temp }}/translate-summary.md
        ACTION_PATH: ${{ github.action_path }}
        AUTOGLOT_SOURCE: ${{ inputs.source }}
        AUTOGLOT_MESSAGES_DIR: ${{ inputs.messages-dir }}
        AUTOGLOT_LOCK_FILE: ${{ inputs.lock-file }}
        AUTOGLOT_CONFIG: ${{ inputs.config }}
        AUTOGLOT_MODEL: ${{ inputs.model }}
        AUTOGLOT_PACKAGE_VERSION: ${{ inputs.package-version }}
      run: node "$ACTION_PATH/.github/scripts/action-cli.mjs"

    - name: Commit and push translations
      if: inputs.commit == 'true'
      id: commit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        AUTOGLOT_SOURCE: ${{ inputs.source }}
        AUTOGLOT_MESSAGES_DIR: ${{ inputs.messages-dir }}
        AUTOGLOT_LOCK_FILE: ${{ inputs.lock-file }}
        AUTOGLOT_CONFIG: ${{ inputs.config }}
        SUMMARY_PATH: ${{ runner.temp }}/translate-summary.md
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        node "$ACTION_PATH/.github/scripts/action-cli.mjs" stage
        if git diff --cached --quiet; then
          echo "No translation changes — skipping."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Pick the branch we should push to:
        #   - push event:         GITHUB_REF_NAME is the branch name (e.g. "main")
        #   - pull_request event: GITHUB_REF_NAME is "<N>/merge" (a synthetic ref
        #                         that doesn't exist on the remote). Use the PR's
        #                         source branch via GITHUB_HEAD_REF instead.
        BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        if [ -z "$BRANCH" ] || [ "$BRANCH" = "merge" ] || [[ "$BRANCH" == */merge ]]; then
          echo "::error::Could not determine a real branch to push to (got: $BRANCH)."
          echo "::error::On pull_request workflows, set 'ref: github.head_ref' on your actions/checkout step."
          echo "::error::See https://github.com/ffcabbar/autoglot#want-it-to-run-on-pull-requests-instead"
          exit 1
        fi
        # On pull_request, the default checkout leaves HEAD on a merge commit
        # in detached state — pushing that as the PR branch tip would rewrite
        # the PR with merge-commit garbage. Detect and surface a clear error.
        if [ -n "${GITHUB_HEAD_REF:-}" ]; then
          CURRENT="$(git symbolic-ref --quiet --short HEAD || echo '')"
          if [ -z "$CURRENT" ]; then
            echo "::error::HEAD is detached on a merge ref — autoglot can't safely push back."
            echo "::error::Add 'ref: github.head_ref' to your actions/checkout step."
            echo "::error::See https://github.com/ffcabbar/autoglot#want-it-to-run-on-pull-requests-instead"
            exit 1
          fi
        fi
        {
          echo "chore(i18n): update translations"
          echo
          cat "$SUMMARY_PATH"
        } > "$RUNNER_TEMP/translate-commit-msg.txt"
        git commit -F "$RUNNER_TEMP/translate-commit-msg.txt"
        for attempt in 1 2 3; do
          git rebase --abort 2>/dev/null || true
          if git pull --rebase origin "$BRANCH" \
            && git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Push attempt ${attempt} failed; retrying."
          sleep 2
        done
        echo "::error::Failed to push translations after 3 attempts."
        exit 1

    - name: Post cost comment on open PR
      if: inputs.pr-comment == 'true' && steps.commit.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY_PATH: ${{ runner.temp }}/translate-summary.md
      run: |
        set -euo pipefail
        BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        PR="$PR_NUMBER"
        if [ -z "$PR" ]; then
          PR=$(gh pr list --head "$BRANCH" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
        fi
        if [ -z "${PR}" ]; then
          echo "No open PR for ${BRANCH} — skipping comment."
          exit 0
        fi
        {
          cat "$SUMMARY_PATH"
          echo
          echo "---"
          echo "_Triggered by [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) · [view workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
        } > "$RUNNER_TEMP/translate-comment.md"
        gh pr comment "${PR}" --body-file "$RUNNER_TEMP/translate-comment.md"
